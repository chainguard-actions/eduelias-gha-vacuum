name: Test vacuum version command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept vacuum installer
        run: |
          # Write the fake install script to a known location
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-install-vacuum.sh" /tmp/fake-install-vacuum.sh
          chmod +x /tmp/fake-install-vacuum.sh

          # Create a fake curl that intercepts the vacuum install URL
          # Supports both "curl URL | sh" (stdout) and hardened "curl -o FILE URL" forms
          cat > /tmp/fake-curl << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *install_vacuum*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-vacuum.sh > "$out"
              else
                cat /tmp/fake-install-vacuum.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          chmod +x /tmp/fake-curl

          # Prepend /tmp/fake-bin to PATH so fake curl is found first
          mkdir -p /tmp/fake-bin
          cp /tmp/fake-curl /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          cmd: vacuum version

      - name: Assert action succeeded
        run: |
          echo "PASS: vacuum version command completed successfully"
